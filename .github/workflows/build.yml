name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ambiente
        run: |
          echo "::notice title=Ambiente::ANDROID_HOME=${ANDROID_HOME:-vazio} platforms=$(ls ${ANDROID_HOME:-/nonexistent}/platforms 2>&1 | tr '\n' ' ') java=$(java -version 2>&1 | head -1)"

      - name: Aceitar licencas do SDK
        run: |
          SDKM=$(ls ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=${SDKM:-nao achei}"
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |^w: .*(Unresolved|error)|FAILED|What went wrong|Execution failed|Could not|error:|Caused by" -A3 build.log | head -90)
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Erros do Gradle::${msg}"
            tail -25 build.log | sed 's/^/LOG: /'
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: capri-chip-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar o APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk capri-chip.apk
          gh release create "apk-${{ github.run_number }}" capri-chip.apk \
            --title "Capri Chip, build ${{ github.run_number }}" \
            --notes "APK de teste (debug). Baixe capri-chip.apk e instale no Android."
